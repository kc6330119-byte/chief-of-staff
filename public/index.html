<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chief of Staff for Managers</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="sidebar">
      <div class="brand">
        <span class="brand-name">Chief of Staff for Managers</span>
      </div>
      <nav class="site-nav" aria-label="Pages">
        <a href="#/today" data-page="today">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
          <span class="nav-label">Today</span>
          <span class="nav-count nav-badge" id="today-count" hidden></span>
        </a>
        <a href="#/meetings" data-page="meetings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
          <span class="nav-label">Meetings</span>
        </a>
        <a href="#/board" data-page="board">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"></rect><rect x="10" y="4" width="5" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="7" rx="1"></rect></svg>
          <span class="nav-label">Board</span>
          <span class="nav-count" id="board-open-count" hidden></span>
        </a>
        <a href="#/people" data-page="people">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"></path></svg>
          <span class="nav-label">People</span>
        </a>
        <a href="#/agents" data-page="agents">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="2"></rect><path d="M12 8V4M9 13v2M15 13v2"></path></svg>
          <span class="nav-label">Agents</span>
        </a>
        <a href="#/library" data-page="library">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg>
          <span class="nav-label">Library</span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <span class="chip chip-late" id="demo-badge" hidden>Recreated demo data</span>
        <a class="help-link" href="#/help" data-page="help">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"></path><path d="M12 17.5h.01"></path></svg>
          <span>Help</span>
        </a>
        <span class="local-mark" title="Runs on this Mac. No server, no network calls.">Local only</span>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
